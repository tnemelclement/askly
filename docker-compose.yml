# Postgres local pour le dev et les tests. Strictement local : identifiants de dev,
# repris dans `.env.example` (`postgresql://questionnaire:questionnaire@localhost:5436/questionnaire`).
services:
  postgres:
    image: postgres:18-alpine
    container_name: questionnaire-postgres
    environment:
      POSTGRES_USER: questionnaire
      POSTGRES_PASSWORD: questionnaire
      POSTGRES_DB: questionnaire
    ports:
      - "5436:5432"
    volumes:
      - questionnaire-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questionnaire"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3 local (images et fichiers des répondants), RustFS : compatible S3, libre.
  # Le bucket est créé par l'API au démarrage (S3_CREATE_BUCKET=true). En production : un vrai S3.
  s3:
    image: rustfs/rustfs:latest
    container_name: questionnaire-s3
    environment:
      RUSTFS_ACCESS_KEY: questionnaire
      RUSTFS_SECRET_KEY: questionnaire
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "9100:9000"
    volumes:
      - questionnaire-s3data:/data

volumes:
  questionnaire-pgdata:
  questionnaire-s3data:
