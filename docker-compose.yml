# Postgres local pour le dev et les tests. Strictement local : identifiants de dev,
# repris dans `.env.example` (`postgresql://askly:askly@localhost:5436/askly`).
# Nom fixe : sinon Compose le déduit du dossier.
name: askly

services:
  postgres:
    image: postgres:18-alpine
    container_name: askly-postgres
    environment:
      POSTGRES_USER: askly
      POSTGRES_PASSWORD: askly
      POSTGRES_DB: askly
    ports:
      - "5436:5432"
    volumes:
      - askly-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3 local (images et fichiers des répondants), RustFS : compatible S3, libre.
  # Le bucket est créé par l'API au démarrage (S3_CREATE_BUCKET=true). En production : un vrai S3.
  s3:
    image: rustfs/rustfs:latest
    container_name: askly-s3
    environment:
      RUSTFS_ACCESS_KEY: askly
      RUSTFS_SECRET_KEY: askly
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "9100:9000"
    volumes:
      - askly-s3data:/data

volumes:
  askly-pgdata:
  askly-s3data:
